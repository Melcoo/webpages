<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MTI — Web Projects</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-grad-1: #eef2ff;
    --bg-grad-2: #f0fdfa;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #4f46e5;
    --accent-2: #0ea5a4;
    --card-bg: #ffffff;
    --card-border: rgba(15,23,42,0.06);
    --shadow: 0 20px 45px -15px rgba(30,41,59,0.15);
    --shadow-hover: 0 25px 55px -12px rgba(79,70,229,0.35);
  }
  [data-theme="dark"] {
    --bg: #0a0e1a;
    --bg-grad-1: #0f1428;
    --bg-grad-2: #0a1f1c;
    --text: #eef2ff;
    --muted: #94a3c7;
    --accent: #818cf8;
    --accent-2: #2dd4bf;
    --card-bg: #131a2e;
    --card-border: rgba(255,255,255,0.08);
    --shadow: 0 20px 45px -15px rgba(0,0,0,0.5);
    --shadow-hover: 0 25px 60px -12px rgba(129,140,248,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 15% -5%, var(--bg-grad-1), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, var(--bg-grad-2), transparent 55%),
      var(--bg);
    transition: background 0.4s ease, color 0.4s ease;
    overflow-x: hidden;
  }
  .noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: radial-gradient(circle at 1px 1px, #000 1px, transparent 0);
    background-size: 22px 22px;
    z-index: 0;
  }
  .wrap {
    position: relative;
    z-index: 1;
    max-width: 1140px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 3.5rem;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .mark {
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #fff; font-size: 1rem;
    box-shadow: 0 10px 25px -6px rgba(79,70,229,0.5);
  }
  .brand-name { font-weight: 800; font-size: 1.05rem; letter-spacing: 0.3px; }
  .brand-sub { font-size: 0.78rem; color: var(--muted); }
  .toggle {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--card-border);
    background: var(--card-bg);
    padding: 0.5rem 0.95rem;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.85rem;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
  }
  .toggle:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }

  .hero { text-align: center; margin-bottom: 3.5rem; }
  .eyebrow {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    margin-bottom: 1.1rem;
  }
  .hero h1 {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -0.5px;
    margin-bottom: 0.9rem;
    background: linear-gradient(120deg, var(--text), var(--accent) 60%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 560px;
    margin: 0 auto;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1.4rem;
  }
  .card {
    position: relative;
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 1.6rem;
    box-shadow: var(--shadow);
    overflow: hidden;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent 60%);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .card:hover {
    transform: translateY(-6px) scale(1.01);
    box-shadow: var(--shadow-hover);
    border-color: color-mix(in srgb, var(--accent) 40%, var(--card-border));
  }
  .card:hover::before { opacity: 1; }
  .card-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(140deg, var(--accent), var(--accent-2));
    margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
  }
  .card-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.4rem; position: relative; z-index: 1; }
  .card-desc { font-size: 0.9rem; color: var(--muted); line-height: 1.5; margin-bottom: 1.1rem; position: relative; z-index: 1; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    position: relative; z-index: 1;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 0.35rem;
    font-size: 0.72rem; font-weight: 700;
    color: var(--accent-2);
    background: color-mix(in srgb, var(--accent-2) 14%, transparent);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 25%, transparent); }
  .arrow { color: var(--muted); font-size: 1.1rem; transition: transform 0.2s ease, color 0.2s ease; }
  .card:hover .arrow { transform: translateX(4px); color: var(--accent); }

  .footer {
    margin-top: 3.5rem;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <div class="noise"></div>
  <div class="wrap">
    <nav class="nav">
      <div class="brand">
        <div class="mark">M</div>
        <div>
          <div class="brand-name">MTI</div>
          <div class="brand-sub">Web Projects by Melcoo</div>
        </div>
      </div>
      <button class="toggle" id="themeToggle" type="button">
        <span id="toggleIcon">🌙</span>
        <span id="toggleLabel">Dark</span>
      </button>
    </nav>

    <section class="hero">
      <span class="eyebrow">Personal portal</span>
      <h1>A home for every project I ship</h1>
      <p>Small, self‑contained web apps — dashboards, tools, and experiments — collected in one place.</p>
    </section>

    <main class="grid">
      <a class="card" href="world-clock/" target="_blank" rel="noopener">
        <div class="card-icon">🕒</div>
        <div class="card-title">World Clock</div>
        <div class="card-desc">Live time across major world cities, refreshing every second in real time.</div>
        <div class="card-foot">
          <span class="pill"><span class="dot"></span>Live</span>
          <span class="arrow">→</span>
        </div>
      </a>
      <!-- Future projects: add a new <a class="card"> block here -->
    </main>

    <div class="footer">More projects landing soon.</div>
  </div>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');
    const icon = document.getElementById('toggleIcon');
    const label = document.getElementById('toggleLabel');

    function apply(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('mti-theme', theme);
      if (theme === 'dark') { icon.textContent = '☀️'; label.textContent = 'Light'; }
      else { icon.textContent = '🌙'; label.textContent = 'Dark'; }
    }

    const saved = localStorage.getItem('mti-theme');
    apply(saved === 'dark' ? 'dark' : 'light');

    btn.addEventListener('click', () => {
      const cur = root.getAttribute('data-theme') || 'light';
      apply(cur === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
