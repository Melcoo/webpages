<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MTI — Web Projects</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <div class="brand-text">
          <div class="title">MTI</div>
          <div class="subtitle">Web Projects by Melcoo</div>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button">Switch to dark</button>
    </header>

    <main class="grid" id="projectsGrid">
      <a class="card" href="world-clock/" target="_blank" rel="noopener">
        <div class="card-accent" aria-hidden="true"></div>
        <div class="card-title">World Clock</div>
        <div class="card-desc">Live time in major cities worldwide, updating every second.</div>
        <div class="card-meta">
          <span class="badge">Live</span>
          <span>Single‑page app</span>
        </div>
      </a>
      <!-- Future projects will be added here as new cards -->
    </main>

    <div class="footer">
      More projects coming soon.
    </div>
  </div>

  <script>
    const root = document.documentElement;
    const btn = document.getElementById('themeToggle');

    function applyTheme(theme) {
      root.setAttribute('data-theme', theme);
      localStorage.setItem('mti-theme', theme);
      btn.textContent = theme === 'dark' ? 'Switch to light' : 'Switch to dark';
    }

    const saved = localStorage.getItem('mti-theme');
    if (saved === 'light' || saved === 'dark') {
      applyTheme(saved);
    } else {
      applyTheme('light');
    }

    btn.addEventListener('click', () => {
      const current = root.getAttribute('data-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    });
  </script>
</body>
</html>
